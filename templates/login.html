<!DOCTYPE html>
<html>
<head>
    <title>Hostel Mess Management System - Role Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); width: 400px; }
        h2 { text-align: center; color: #1e293b; margin: 0 0 5px 0; }
        .sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 20px; }
        
        /* 4 Role Selector Buttons */
        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .role-option { display: none; }
        .role-label {
            text-align: center; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px;
            font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; transition: 0.2s;
        }
        .role-option:checked + .role-label {
            border-color: #2563eb; background: #eff6ff; color: #1d4ed8;
        }

        label.field-label { font-weight: 600; font-size: 14px; color: #334155; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1;
            border-radius: 6px; box-sizing: border-box; font-size: 14px;
        }
        button.submit-btn {
            width: 100%; padding: 12px; background: #2563eb; color: white; border: none;
            border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;
        }
        button.submit-btn:hover { background: #1d4ed8; }
        .error { background: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 14px; }
        
        /* Quick Fill Demo Section */
        .creds { margin-top: 20px; font-size: 12px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; color: #475569; }
        .quick-btns { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .q-btn { flex: 1; padding: 6px; font-size: 11px; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; color: #1e293b; }
        .q-btn:hover { background: #cbd5e1; }
    </style>
</head>
<body>
<div class="card">
    <h2>Hostel Mess Portal</h2>
    <div class="sub">Select Actor Role to Login</div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
        <label class="field-label">1. Choose Your Role:</label>
        <div class="role-grid">
            <input type="radio" id="r_student" name="role" value="student" class="role-option" checked>
            <label for="r_student" class="role-label">🎓 Student</label>

            <input type="radio" id="r_manager" name="role" value="manager" class="role-option">
            <label for="r_manager" class="role-label">📋 Mess Manager</label>

            <input type="radio" id="r_staff" name="role" value="staff" class="role-option">
            <label for="r_staff" class="role-label">👨‍🍳 Mess Staff</label>

            <input type="radio" id="r_admin" name="role" value="admin" class="role-option">
            <label for="r_admin" class="role-label">🛡️ Admin / Warden</label>
        </div>

        <label class="field-label" for="username">2. Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required>

        <label class="field-label" for="password">3. Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <button type="submit" class="submit-btn">Login as Selected Role</button>
    </form>

    <div class="creds">
        <strong>One-Click Demo Auto-Fill:</strong>
        <div class="quick-btns">
            <button type="button" class="q-btn" onclick="fillCreds('r_student', 'piyush', 'password123')">Student</button>
            <button type="button" class="q-btn" onclick="fillCreds('r_manager', 'manager1', 'password123')">Manager</button>
            <button type="button" class="q-btn" onclick="fillCreds('r_staff', 'staff1', 'password123')">Staff</button>
            <button type="button" class="q-btn" onclick="fillCreds('r_admin', 'admin1', 'adminpass')">Admin</button>
        </div>
    </div>
</div>

<script>
function fillCreds(roleId, user, pass) {
    document.getElementById(roleId).checked = true;
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
}
</script>
</body>
</html>
